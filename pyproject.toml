[project]
name = "zentra-task-manager"
version = "0.1.0"
description = "Secure departmental and personal task management"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-WTF>=1.2,<2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
